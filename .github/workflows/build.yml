name: Build Fast Track

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Zeus CLI
        run: npm install --global @zeppos/zeus-cli@latest

      - name: Verify Zeus installation
        run: zeus -v

      - name: Build Fast Track
        run: zeus build

      - name: Show build output
        if: always()
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort
          echo "Dist files:"
          find dist -maxdepth 3 -type f 2>/dev/null | sort || true

      - name: Upload Zepp package
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-build
          path: dist/
          if-no-files-found: error
