name: Build Fast Track

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm install -g @zeppos/zeus-cli

      - run: zeus build

      - uses: actions/upload-artifact@v4
        with:
          name: fast-track-build
          path: dist/
